<script>
  // 1. 실제 작동 중인 Cloudflare Worker URL 입력
  const WORKER_URL = "https://slack-second-brain.dloolb7.workers.dev/"; // 본인의 worker 주소로 수정

  let NEWS_DATA = { stock: [], crypto: [], realestate: [] };
  let DEFAULT_ARCHIVE = [];
  let currentSector = 'stock';
  let selectedNews = null;
  let saveTimer = null;

  window.addEventListener('DOMContentLoaded', () => {
    updateClock();
    setInterval(updateClock, 1000);
    fetchInitDataFromWorker(); // Worker를 통해 Supabase 실시간 데이터 동동 로드
    loadFromLocalStorage();
  });

  // Cloudflare Worker를 통한 Supabase 실시간 데이터 로드
  async function fetchInitDataFromWorker() {
    try {
      showToast('🔄 Supabase 실시간 데이터를 불러오는 중...');
      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'get_init_data' })
      });

      const data = await response.json();

      // 우측 과거 아카이브 바인딩
      if (data.archives && Array.isArray(data.archives)) {
        DEFAULT_ARCHIVE = data.archives.map(item => ({
          id: item.id,
          date: new Date(item.created_at).toISOString().slice(0, 10),
          title: item.title,
          coreClaim: (item.content_final || '').slice(0, 150) + '...',
          tags: ['#블로그아카이브'],
          snapshot: 'Supabase DB'
        }));
        renderArchiveList();
      }

      showToast('✅ Supabase 실시간 데이터 동기화 완료!');
    } catch (err) {
      console.warn('초기 데이터 로딩 실패:', err);
      showToast('⚠️ 실시간 데이터 동기화 실패 (기본 화면으로 표시합니다)');
    }
  }

  // (이하 시계, switchSector, runThreeStageRefiner, 복사 함수 등 기존 스크립트 그대로 유지)
</script>
