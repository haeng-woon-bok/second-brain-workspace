<script>
  // 1. 실제 작동 중인 Cloudflare Worker URL
  const WORKER_URL = "https://slack-second-brain.dloolb7.workers.dev/";

  let NEWS_DATA = { stock: [], crypto: [], realestate: [] };
  let DEFAULT_ARCHIVE = [];
  let currentSector = 'stock';
  let selectedNews = null;
  let saveTimer = null;

  window.addEventListener('DOMContentLoaded', () => {
    updateClock();
    setInterval(updateClock, 1000);
    fetchInitDataFromWorker(); // Supabase 데이터 동적 로드
    loadFromLocalStorage();
  });

  function updateClock() {
    const now = new Date();
    const options = {
      timeZone: 'Asia/Seoul',
      year: 'numeric', month: '2-digit', day: '2-digit',
      weekday: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    };
    const el = document.getElementById('kst-clock');
    if (el) el.textContent = `KST ${new Intl.DateTimeFormat('ko-KR', options).format(now)}`;
  }

  // Cloudflare Worker를 통한 Supabase 실시간 데이터 로드 & UI 파싱
  async function fetchInitDataFromWorker() {
    try {
      showToast('🔄 Supabase 실시간 데이터를 불러오는 중...');
      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'get_init_data' })
      });

      const data = await response.json();

      // 1. 좌측 뉴스 피드 데이터 바인딩 (수정 반영)
      if (data.news) {
        parseAndSetNewsData(data.news);
        switchSector(currentSector);
      }

      // 2. 우측 과거 아카이브 바인딩
      if (data.archives && Array.isArray(data.archives)) {
        DEFAULT_ARCHIVE = data.archives.map(item => ({
          id: item.id,
          date: new Date(item.created_at).toISOString().slice(0, 10),
          title: item.title,
          coreClaim: (item.content_final || '').slice(0, 150) + '...',
          tags: ['#블로그아카이브'],
          snapshot: 'Supabase DB'
        }));
        renderArchiveList();
      }

      showToast('✅ Supabase 실시간 데이터 동기화 완료!');
    } catch (err) {
      console.warn('초기 데이터 로딩 실패:', err);
      showToast('⚠️ 실시간 데이터 동기화 실패 (기본 모드로 동작합니다)');
    }
  }

  // Supabase 뉴스 JSON 텍스트 파싱 헬퍼
  function parseAndSetNewsData(rawNews) {
    const parseSection = (text, sectorName) => {
      if (!text) return [];
      const items = text.split(/• 제목:\s*/).filter(Boolean);
      return items.map((item, idx) => {
        const lines = item.split('\n').map(l => l.trim()).filter(Boolean);
        const title = lines[0] || '뉴스 제목 정보 없음';
        const linkLine = lines.find(l => l.startsWith('링크:')) || '';
        const summaryLine = lines.find(l => l.startsWith('요약:')) || '';
        
        return {
          id: `${sectorName}_${idx}`,
          sector: sectorName,
          title: title,
          link: linkLine.replace('링크:', '').trim(),
          summary: summaryLine.replace('요약:', '').trim(),
          keywords: [sectorName, '실시간뉴스']
        };
      });
    };

    NEWS_DATA = {
      stock: parseSection(rawNews['증시'], '증시/매크로'),
      crypto: parseSection(rawNews['비트코인/이더리움'], '가상자산'),
      realestate: parseSection(rawNews['부동산'], '부동산/정비')
    };
  }

  function switchSector(sector) {
    currentSector = sector;
    ['stock', 'crypto', 'realestate'].forEach(s => {
      const btn = document.getElementById(`tab-${s}`);
      if (btn) {
        btn.className = s === sector 
          ? 'text-xs py-1.5 font-semibold bg-indigo-600 text-white transition' 
          : 'text-xs py-1.5 font-medium text-slate-400 hover:text-white transition';
      }
    });

    const container = document.getElementById('news-list-container');
    if (!container) return;
    container.innerHTML = '';

    const sectorItems = NEWS_DATA[sector] || [];
    if (sectorItems.length === 0) {
      container.innerHTML = `<div class="text-xs text-slate-500 text-center py-6">수집된 뉴스가 없습니다.</div>`;
      return;
    }

    sectorItems.forEach(item => {
      const isSelected = selectedNews && selectedNews.id === item.id;
      const card = document.createElement('div');
      card.className = `p-3 border cursor-pointer transition ${
        isSelected ? 'bg-indigo-950/60 border-indigo-500' : 'bg-slate-800/50 border-slate-700/80 hover:border-slate-500'
      }`;
      card.onclick = () => selectNewsCard(item);
      card.innerHTML = `
        <div class="flex items-center justify-between mb-1">
          <span class="text-[10px] font-semibold text-indigo-400">${item.sector}</span>
          <span class="text-[10px] text-slate-400">${item.keywords.map(k => '#' + k).join(' ')}</span>
        </div>
        <h4 class="text-xs font-bold text-slate-100 leading-snug mb-1.5">${item.title}</h4>
        <p class="text-[11px] text-slate-400 leading-relaxed line-clamp-2">${item.summary}</p>
      `;
      container.appendChild(card);
    });
  }

  function selectNewsCard(item) {
    selectedNews = item;
    switchSector(currentSector);

    const box = document.getElementById('selected-news-box');
    if (box) box.classList.remove('hidden');
    
    document.getElementById('ref-news-sector').textContent = item.sector;
    document.getElementById('ref-news-title').textContent = item.title;
    document.getElementById('ref-news-summary').textContent = item.summary;

    if (item.keywords && item.keywords.length > 0) {
      document.getElementById('archive-search').value = item.keywords[0];
      renderArchiveList();
    }
    showToast(`📌 뉴스 맥락이 주입되었습니다.`);
  }

  function clearSelectedNews() {
    selectedNews = null;
    const box = document.getElementById('selected-news-box');
    if (box) box.classList.add('hidden');
    switchSector(currentSector);
    resetArchiveFilter();
  }

  function handleDraftInput() {
    const title = document.getElementById('draft-title').value;
    const memo = document.getElementById('draft-memo').value;
    const tags = document.getElementById('draft-tags').value;

    const charLen = memo.length;
    const wordLen = memo.trim() ? memo.trim().split(/\s+/).length : 0;
    const readMin = Math.max(1, Math.ceil(charLen / 500));

    document.getElementById('char-count').textContent = `${charLen.toLocaleString()}자`;
    document.getElementById('word-count').textContent = `${wordLen.toLocaleString()}단어`;
    document.getElementById('read-time').textContent = `예상 독서 약 ${readMin}분`;

    const indicator = document.getElementById('save-indicator');
    const statusText = document.getElementById('save-status-text');
    if (indicator) indicator.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
    if (statusText) statusText.textContent = '자동 저장 중...';

    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      localStorage.setItem('dad_studio_draft', JSON.stringify({ title, memo, tags }));
      if (indicator) indicator.className = 'w-2 h-2 rounded-full bg-emerald-400';
      if (statusText) statusText.textContent = 'LocalStorage 자동 저장됨';
    }, 400);
  }

  function loadFromLocalStorage() {
    const saved = localStorage.getItem('dad_studio_draft');
    if (saved) {
      try {
        const { title, memo, tags } = JSON.parse(saved);
        document.getElementById('draft-title').value = title || '';
        document.getElementById('draft-memo').value = memo || '';
        document.getElementById('draft-tags').value = tags || '';
        handleDraftInput();
      } catch (e) {}
    }
  }

  // AI 3단 서사 첨삭 (Cloudflare Worker 연동)
  async function runThreeStageRefiner() {
    const title = document.getElementById('draft-title').value.trim() || '오늘자 매크로 현황 및 인사이트 노트';
    const memo = document.getElementById('draft-memo').value.trim();
    const btn = document.getElementById('btn-refine');
    const badge = document.getElementById('engine-badge');

    if (!memo && !selectedNews) {
      showToast('⚠️ 좌측 뉴스를 선택하거나 메모(60~70%)를 작성해 주세요.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span>⏳ Cloudflare Worker 정제 처리 중...</span>';
    badge.textContent = 'Worker API 가동 중';
    badge.className = 'text-[11px] bg-indigo-950 text-indigo-300 px-2 py-0.5 border border-indigo-700';

    const promptText = `[뉴스 참고]: ${selectedNews ? selectedNews.title + ' - ' + selectedNews.summary : '없음'}\n[가제]: ${title}\n[초안 메모]: ${memo}`;

    try {
      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'web_draft',
          prompt: promptText
        })
      });

      const data = await response.json();

      if (data.draft) {
        document.getElementById('refined-output').value = data.draft.trim();
        badge.textContent = 'Cloudflare Worker 정제 완료';
        showToast('✨ Worker 및 Gemini 파이프라인으로 완성본이 작성되었습니다.');
      } else {
        throw new Error(data.error || 'Worker 응답에 draft 필드가 없습니다.');
      }
    } catch (err) {
      console.warn('Worker 연동 오류:', err);
      badge.textContent = 'Worker 연결 오류';
      showToast('⚠️ AI 첨삭 요청 처리 중 오류가 발생했습니다.');
    }

    btn.disabled = false;
    btn.innerHTML = '<span>✨ AI 3단 서사 첨삭 및 다듬기</span>';
  }

  // 복사 기능 1: 네이버 스마트에디터 서식
  async function copyForNaverSmartEditor() {
    const rawText = document.getElementById('refined-output').value.trim();
    if (!rawText) {
      showToast('⚠️ 복사할 완결문이 없습니다.');
      return;
    }

    const lines = rawText.split('\n');
    let htmlParts = [`<div style="font-family: 'Nanum Gothic', sans-serif; font-size: 16px; line-height: 1.85; color: #222222;">`];

    lines.forEach(line => {
      const trimmed = line.trim();
      if (!trimmed) {
        htmlParts.push(`<p style="margin: 0 0 14px 0;">&nbsp;</p>`);
      } else if (trimmed.startsWith('■')) {
        htmlParts.push(`<h2 style="font-size: 22px; font-weight: 700; color: #111827; margin: 10px 0 20px 0; padding-bottom: 8px; border-bottom: 2px solid #1e293b;">${trimmed.replace('■', '').trim()}</h2>`);
      } else if (trimmed.startsWith('[1단:') || trimmed.startsWith('[2단:') || trimmed.startsWith('[3단:')) {
        htmlParts.push(`<blockquote style="margin: 24px 0 12px 0; padding: 12px 16px; background-color: #f8fafc; border-left: 4px solid #03c75a; font-weight: 700; color: #111827;">${trimmed}</blockquote>`);
      } else if (trimmed.startsWith('"') && trimmed.endsWith('"')) {
        htmlParts.push(`<blockquote style="margin: 18px 0; padding: 16px 20px; background-color: #f1f5f9; border-radius: 6px; font-style: italic; font-weight: 600; color: #0f172a; text-align: center;">${trimmed}</blockquote>`);
      } else {
        htmlParts.push(`<p style="margin: 0 0 14px 0; color: #333333;">${trimmed}</p>`);
      }
    });

    const tags = document.getElementById('draft-tags').value.trim();
    if (tags) htmlParts.push(`<p style="margin-top: 24px; color: #03c75a; font-weight: 600;">${tags}</p>`);
    htmlParts.push(`</div>`);

    try {
      const blobHtml = new Blob([htmlParts.join('')], { type: 'text/html' });
      const blobText = new Blob([rawText], { type: 'text/plain' });
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': blobHtml, 'text/plain': blobText })]);
      showToast('🟢 네이버 스마트에디터 최적화 서식이 복사되었습니다!');
    } catch (e) {
      await navigator.clipboard.writeText(rawText);
      showToast('📄 클립보드에 복사되었습니다.');
    }
  }

  // 복사 기능 2: 일반 텍스트
  async function copyPlainText() {
    const rawText = document.getElementById('refined-output').value.trim();
    if (!rawText) {
      showToast('⚠️ 복사할 본문이 없습니다.');
      return;
    }
    await navigator.clipboard.writeText(rawText);
    showToast('📄 일반 텍스트가 복사되었습니다.');
  }

  // 복사 기능 3: 스레드(Threads) 500자 분할 복사
  async function copyThreadsFormat() {
    const rawText = document.getElementById('refined-output').value.trim() || document.getElementById('draft-memo').value.trim();
    if (!rawText) {
      showToast('⚠️ 분할 복사할 본문이나 메모가 없습니다.');
      return;
    }

    const maxChunkSize = 450;
    const paragraphs = rawText.split('\n');
    let chunks = [];
    let currentChunk = "";

    paragraphs.forEach(p => {
      if ((currentChunk + "\n" + p).length > maxChunkSize) {
        if (currentChunk.trim()) chunks.push(currentChunk.trim());
        currentChunk = p;
      } else {
        currentChunk += (currentChunk ? "\n" : "") + p;
      }
    });
    if (currentChunk.trim()) chunks.push(currentChunk.trim());

    const total = chunks.length;
    const formattedThreads = chunks.map((c, idx) => `[${idx + 1}/${total}]\n${c}`).join('\n\n---\n\n');

    await navigator.clipboard.writeText(formattedThreads);
    showToast(`🧵 총 ${total}개의 연속 스레드 카드로 분할 복사되었습니다!`);
  }

  // 우측 타임라인 렌더링
  function renderArchiveList() {
    const container = document.getElementById('archive-list-container');
    if (!container) return;
    const query = document.getElementById('archive-search').value.trim().toLowerCase();

    container.innerHTML = '';

    const filtered = DEFAULT_ARCHIVE.filter(item => {
      if (!query) return true;
      return (
        item.title.toLowerCase().includes(query) ||
        item.coreClaim.toLowerCase().includes(query) ||
        item.tags.some(t => t.toLowerCase().includes(query))
      );
    });

    if (filtered.length === 0) {
      container.innerHTML = `<div class="text-xs text-slate-500 text-center py-8 border border-dashed border-slate-800">과거 기록이 없습니다.</div>`;
      return;
    }

    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = 'bg-slate-800/40 border border-slate-800 p-3.5 space-y-2';
      card.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-mono text-indigo-400">${item.date}</span>
          <span class="text-[10px] bg-slate-900 text-slate-400 px-2 py-0.5 border border-slate-700">${item.snapshot}</span>
        </div>
        <h4 class="text-xs font-bold text-slate-200 leading-snug">${item.title}</h4>
        <p class="text-xs text-slate-300 leading-relaxed bg-slate-900/70 p-2.5 border-l-2 border-slate-600">
          ${item.coreClaim}
        </p>
        <div class="flex flex-wrap gap-1 pt-0.5">
          ${item.tags.map(t => `<span class="text-[10px] text-slate-400 bg-slate-900 px-1.5 py-0.5">${t}</span>`).join('')}
        </div>
      `;
      container.appendChild(card);
    });
  }

  function resetArchiveFilter() {
    document.getElementById('archive-search').value = '';
    renderArchiveList();
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 3200);
  }
</script>
