<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insight Studio · dad_luckyhappy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    // 첫 화면 깜빡임 방지: 저장된 테마를 렌더 전에 적용
    try { if (localStorage.getItem('dad_studio_theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
  </script>
  <style>
    /* ===== 디자인 토큰: A1 Paper (라이트) / Warm ink (다크) ===== */
    :root {
      --bg:#EFECE5; --panel:#F6F4EF; --sunken:#E8E4DC; --line:#D9D4C9; --ink:#1F1E1B; --sub:#6B675E; --faint:#9A958A;
      --accent:#3F4A3C; --accent-hover:#2F382D; --accent-ink:#F6F4EF; --accent-soft:#DCE0D4;
      --warn:#8A5A2B; --warn-soft:#EFE3D2; --bad:#9B3B2E; --bad-soft:#F1DDD7; --good:#3F6B3A; --good-soft:#DDE8D6;
      --radius:4px;
      --serif:'Noto Serif KR', serif;
      --sans:'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --mono:'IBM Plex Mono', ui-monospace, monospace;
      color-scheme: light;
    }
    html.dark {
      --bg:#1B1A18; --panel:#22211E; --sunken:#2A2925; --line:#3A3832; --ink:#ECE8DF; --sub:#B4AFA4; --faint:#7F7A70;
      --accent:#B7C3A6; --accent-hover:#C8D3B8; --accent-ink:#1B1A18; --accent-soft:#343A2E;
      --warn:#D7A46E; --warn-soft:#3A2E22; --bad:#E08F80; --bad-soft:#3D2723; --good:#A9C99F; --good-soft:#283326;
      color-scheme: dark;
    }

    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body { background:var(--bg); color:var(--ink); font:14px/1.6 var(--sans); display:flex; flex-direction:column; overflow:hidden; -webkit-font-smoothing:antialiased; }
    button, input, select, textarea { font:inherit; color:inherit; }
    button { cursor:pointer; background:none; border:0; }
    button:disabled { cursor:not-allowed; opacity:.5; }
    a { color:inherit; }
    .serif { font-family:var(--serif); }
    .mono { font-family:var(--mono); }
    .hidden { display:none !important; }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--line); border-radius:3px; }
    ::placeholder { color:var(--faint); }
    :focus-visible { outline:2px solid var(--accent); outline-offset:1px; }

    /* ===== 버튼 ===== */
    .btn { display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:var(--accent-ink); padding:7px 14px; border-radius:var(--radius); font-size:13px; font-weight:600; white-space:nowrap; transition:background .15s; }
    .btn:hover:not(:disabled) { background:var(--accent-hover); }
    .btn-sec { display:inline-flex; align-items:center; gap:6px; background:transparent; color:var(--ink); border:1px solid var(--line); padding:6px 13px; border-radius:var(--radius); font-size:13px; white-space:nowrap; transition:background .15s; }
    .btn-sec:hover:not(:disabled) { background:var(--sunken); }
    .btn-xs { padding:3px 9px; font-size:12px; }
    .icon-btn { width:30px; height:30px; border:1px solid var(--line); border-radius:var(--radius); display:grid; place-items:center; color:var(--sub); font-size:13px; }
    .icon-btn:hover { background:var(--sunken); color:var(--ink); }
    .icon-btn.on { color:var(--accent); border-color:var(--accent); }
    .link { color:var(--sub); font-size:12px; }
    .link:hover { color:var(--ink); text-decoration:underline; }

    /* ===== 헤더 ===== */
    header { height:52px; flex-shrink:0; display:flex; align-items:center; gap:14px; padding:0 24px; border-bottom:1px solid var(--line); background:var(--panel); }
    .logo { font-family:var(--serif); font-weight:700; font-size:16px; letter-spacing:-.01em; white-space:nowrap; }
    .logo span { color:var(--faint); font-weight:500; }
    .draftbar { display:flex; align-items:center; gap:8px; margin-left:28px; min-width:0; flex:1; max-width:640px; }
    .select { flex:1; min-width:0; border:1px solid var(--line); background:var(--sunken); padding:5px 10px; border-radius:var(--radius); font-size:13px; }
    .saved { font-size:12px; color:var(--faint); white-space:nowrap; }
    .saved.warn { color:var(--bad); font-weight:600; }
    .hdr-right { margin-left:auto; display:flex; gap:8px; align-items:center; }

    /* ===== 3단 레이아웃 ===== */
    main { flex:1; display:grid; grid-template-columns:320px minmax(0,1fr) 360px; min-height:0; }
    .col { min-height:0; overflow-y:auto; }
    .left { border-right:1px solid var(--line); background:var(--panel); padding:20px; display:flex; flex-direction:column; gap:22px; }
    .right { border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; overflow:hidden; }
    .center { padding:20px 32px 28px; display:flex; flex-direction:column; gap:16px; }
    .center > * { flex-shrink:0; }
    .kv dd a { color:var(--accent); text-decoration:underline; text-underline-offset:2px; }
    .label { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:600; }
    .h2 { font-family:var(--serif); font-size:15px; font-weight:600; }
    .muted { color:var(--faint); font-size:12px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; }
    .chip { display:inline-block; font-size:11px; padding:1px 8px; border-radius:2px; background:var(--accent-soft); color:var(--accent); }
    .tag { display:inline-block; font-size:11px; color:var(--sub); border:1px solid var(--line); padding:0 6px; border-radius:2px; }
    .clamp2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .clamp3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

    /* ===== 좌측: 달력 · 뉴스 ===== */
    .cal-head { display:flex; justify-content:space-between; align-items:baseline; }
    .cal-nav button { color:var(--faint); font-size:15px; padding:0 6px; }
    .cal-nav button:hover { color:var(--ink); }
    .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; font-size:12px; margin-top:8px; }
    .cal .dow { color:var(--faint); font-size:11px; padding-bottom:4px; }
    .cal .d { padding:5px 0; border-radius:var(--radius); color:var(--faint); position:relative; font-family:var(--mono); }
    .cal button.d { color:var(--ink); }
    .cal button.d::after { content:''; position:absolute; left:50%; bottom:2px; width:3px; height:3px; border-radius:50%; background:var(--sub); transform:translateX(-50%); }
    .cal button.d:hover { background:var(--sunken); }
    .cal .d.sel, .cal .d.sel:hover { background:var(--ink); color:var(--panel); font-weight:600; }
    .cal .d.sel::after { background:var(--panel); }
    .cal .d.today { outline:1px solid var(--line); }
    .group-h { font-size:11px; color:var(--faint); margin:14px 0 2px; display:flex; justify-content:space-between; }
    .attached { font-size:12.5px; color:var(--sub); display:flex; gap:8px; align-items:center; border-left:2px solid var(--accent); padding:2px 0 2px 10px; }
    .attached b { color:var(--ink); font-weight:600; }
    a.btn, a.btn-sec { text-decoration:none; }
    .related { white-space:normal; margin-top:2px; display:flex; flex-direction:column; gap:10px; }
    .related .r-t { font-size:13px; font-weight:600; }
    .related .r-t a { text-decoration:none; } .related .r-t a:hover { text-decoration:underline; }
    .related .r-d { font-family:var(--mono); font-size:11px; color:var(--faint); margin-left:6px; font-weight:400; }
    .related .r-p { font-size:12.5px; color:var(--sub); border-left:2px solid var(--line); padding-left:10px; margin-top:3px; line-height:1.6; }
    .tabs { display:flex; border-bottom:1px solid var(--line); margin-top:6px; }
    .tab { padding:6px 0; margin-right:18px; font-size:13px; color:var(--sub); border-bottom:2px solid transparent; margin-bottom:-1px; }
    .tab:hover { color:var(--ink); }
    .tab.on { color:var(--ink); border-color:var(--ink); font-weight:600; }
    .news-item { display:grid; grid-template-columns:22px 1fr; gap:4px; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
    .news-item .no { font-family:var(--mono); font-size:11px; color:var(--faint); padding-top:2px; }
    .news-item .t { font-size:13.5px; line-height:1.45; }
    .news-item .s { font-size:12px; color:var(--sub); margin-top:3px; }
    .news-item:hover .t { text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; }
    .news-item.on { background:var(--sunken); margin:0 -10px; padding:10px; border-bottom-color:transparent; }
    .news-item.on .t { font-weight:600; }

    /* ===== 중앙: 뉴스 카드 · 에디터 ===== */
    .newscard .top { display:flex; justify-content:space-between; align-items:center; }
    .newscard h3 { font-family:var(--serif); font-size:17px; font-weight:600; margin:8px 0 10px; line-height:1.45; }
    .kv { display:grid; grid-template-columns:72px 1fr; gap:6px 12px; font-size:13px; }
    .kv dt { color:var(--faint); }
    .kv dd { color:var(--ink); white-space:pre-line; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .title-in { width:100%; font-family:var(--serif); font-size:22px; font-weight:600; border:0; border-bottom:1px solid var(--line); padding:4px 0 10px; background:transparent; }
    .title-in:focus { outline:none; border-bottom-color:var(--accent); }
    .area { width:100%; background:var(--sunken); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; font-size:14.5px; line-height:1.8; resize:vertical; }
    .area:focus { outline:none; border-color:var(--accent); }
    .area.body { background:var(--panel); padding:18px 22px; font-size:15px; line-height:1.9; min-height:340px; }
    .bar { display:flex; align-items:center; gap:12px; font-size:12px; color:var(--faint); flex-wrap:wrap; }
    .bar .btn { margin-left:auto; }
    .section-h { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-top:6px; }
    .meta { font-size:12.5px; color:var(--sub); line-height:1.7; border-left:2px solid var(--warn); padding:2px 0 2px 12px; }
    .meta b { color:var(--ink); font-weight:600; }
    .meta .hot { color:var(--bad); font-weight:600; }
    .meta a { text-decoration:underline; text-underline-offset:2px; }
    .actions { display:flex; gap:8px; align-items:center; }
    .actions .sp { flex:1; font-size:12px; color:var(--faint); }

    /* ===== 첨삭 ===== */
    .rv-structure { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .rv-box { border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; background:var(--panel); }
    .rv-box .h { font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px; }
    .rv-box .b { font-size:12px; color:var(--sub); margin-top:3px; line-height:1.5; }
    .dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
    .dot.ok { background:var(--good); } .dot.weak { background:var(--warn); } .dot.missing { background:var(--bad); }
    .rv-style { font-size:12.5px; color:var(--sub); border-left:2px solid var(--line); padding:2px 0 2px 12px; line-height:1.7; }
    .rv-style b { color:var(--ink); font-weight:600; }
    .rv-card { border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; background:var(--panel); display:flex; flex-direction:column; gap:8px; }
    .rv-card.dim { opacity:.5; }
    .rv-cat { font-size:11px; font-weight:600; padding:0 7px; border-radius:2px; }
    .rv-cat.logic { background:var(--bad-soft); color:var(--bad); }
    .rv-cat.structure { background:var(--warn-soft); color:var(--warn); }
    .rv-cat.style { background:var(--accent-soft); color:var(--accent); }
    .rv-cat.readability { background:var(--sunken); color:var(--sub); }
    .rv-target { font-size:12.5px; color:var(--sub); border-left:2px solid var(--line); padding-left:10px; white-space:pre-line; }
    .rv-comment { font-size:13.5px; line-height:1.65; }
    .rv-sugg { font-size:12.5px; background:var(--good-soft); color:var(--ink); border-radius:var(--radius); padding:8px 10px; white-space:pre-line; }
    .rv-sugg b { color:var(--good); }
    .rv-actions { display:flex; gap:6px; justify-content:flex-end; align-items:center; font-size:12px; color:var(--faint); }

    /* ===== 우측: 내 글 기억 ===== */
    .right .head { padding:20px 20px 14px; border-bottom:1px solid var(--line); }
    .search { display:flex; gap:6px; margin-top:8px; }
    .search input { flex:1; min-width:0; border:1px solid var(--line); background:var(--sunken); padding:7px 11px; border-radius:var(--radius); font-size:13px; }
    .search input:focus { outline:none; border-color:var(--accent); }
    .mem-list { flex:1; overflow-y:auto; padding:4px 20px 20px; }
    .mem { border-bottom:1px solid var(--line); padding:13px 0; }
    .mem .tt { font-size:13.5px; font-weight:600; line-height:1.45; }
    .mem .tt a { text-decoration:none; } .mem .tt a:hover { text-decoration:underline; }
    .mem .dt { font-family:var(--mono); font-size:11px; color:var(--faint); margin-top:2px; }
    .mem .ps { font-size:12.5px; color:var(--sub); line-height:1.65; margin-top:6px; }
    .mem .kw { display:flex; gap:5px; flex-wrap:wrap; margin-top:7px; }
    .empty { text-align:center; color:var(--faint); font-size:12.5px; padding:48px 0; }

    /* ===== 토스트 ===== */
    #toast { position:fixed; right:24px; bottom:24px; background:var(--ink); color:var(--bg); font-size:13px; padding:10px 16px; border-radius:var(--radius); z-index:50; max-width:420px; }

    @media (max-width: 1100px) {
      main { grid-template-columns:280px minmax(0,1fr); }
      .right { display:none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Insight Studio <span>· dad_luckyhappy</span></div>
    <div class="draftbar" id="draft-bar">
      <select id="draft-select" onchange="onDraftSelect(this.value)" class="select" disabled>
        <option value="">작업 키를 설정하면 초안 목록이 보입니다</option>
      </select>
      <button onclick="newDraft()" class="btn-sec btn-xs">새 초안</button>
      <button onclick="archiveCurrentDraft()" id="btn-archive" class="btn-sec btn-xs" disabled>보관</button>
      <span id="db-status" class="saved">이 브라우저에 저장</span>
    </div>
    <div class="hdr-right">
      <button onclick="setWorkKey()" id="work-key-btn" class="icon-btn" title="작업 키 — 초안을 서버(DB)에 저장하려면 필요합니다">⚿</button>
      <button onclick="toggleTheme()" id="theme-toggle-btn" class="icon-btn" title="라이트/다크 전환">◐</button>
    </div>
  </header>

  <main>
    <!-- 좌측: 지표 · 섹터 뉴스 -->
    <section class="col left">
      <div>
        <div class="cal-head">
          <span class="h2" id="cal-title">-</span>
          <span class="cal-nav"><button onclick="moveCalMonth(-1)" title="이전 달">‹</button><button onclick="moveCalMonth(1)" title="다음 달">›</button></span>
        </div>
        <div class="cal" id="calendar"></div>
      </div>

      <div>
        <div class="label" id="news-date-label">뉴스</div>
        <div class="tabs">
          <button onclick="switchSector('stock')" id="tab-stock" class="tab on">증시</button>
          <button onclick="switchSector('crypto')" id="tab-crypto" class="tab">가상자산</button>
          <button onclick="switchSector('realestate')" id="tab-realestate" class="tab">부동산</button>
          <button onclick="switchSector('ai')" id="tab-ai" class="tab">AI</button>
        </div>
        <div id="news-list-container"></div>
      </div>
    </section>

    <!-- 중앙: 선택 뉴스 · 초안 · 본문 · 첨삭 -->
    <section class="col center">
      <div id="selected-news-box" class="card newscard hidden">
        <div class="top">
          <span id="ref-news-sector" class="chip">섹터</span>
          <button onclick="closeNewsPreview()" class="link">닫기 ✕</button>
        </div>
        <div id="ref-news-title-wrapper"></div>
        <dl class="kv" id="ref-news-summary"></dl>
        <div class="row" style="margin-top:14px" id="ref-news-actions"></div>
      </div>

      <div id="attached-news" class="attached hidden"></div>

      <input id="draft-title" type="text" class="title-in" placeholder="제목 또는 핵심 주제" oninput="handleDraftInput()" />

      <textarea id="draft-memo" rows="5" class="area" oninput="handleDraftInput()"
        placeholder="뉴스를 보고 떠오른 생각을 편하게 적어 주세요. 글의 내용은 이 메모에서만 나옵니다.&#10;꼭 넣을 해시태그가 있으면 #금리 #재개발 처럼 함께 적어 주세요."></textarea>

      <div class="bar">
        <span class="mono"><span id="char-count">0자</span> · <span id="word-count">0단어</span></span>
        <button onclick="runThreeStageRefiner()" id="btn-refine" class="btn">내 문체로 초안 만들기</button>
      </div>

      <div class="section-h">
        <span class="label">본문 <span id="engine-badge" style="text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px"></span></span>
        <span id="body-count" class="muted mono">0자</span>
      </div>

      <div id="draft-meta" class="meta hidden"></div>

      <textarea id="refined-output" rows="14" class="area body" oninput="handleBodyInput()"
        placeholder="[내 문체로 초안 만들기]를 누르면 메모를 내 블로그 문체로 정리한 글이 여기에 나옵니다. 메모에 없는 내용은 [✍️ 보충 필요]로 표시되니 직접 채워 주세요."></textarea>

      <div class="actions">
        <button id="btn-review" onclick="runReview()" class="btn-sec">첨삭 받기</button>
        <span id="review-summary" class="sp">논리·구조, 내 문체, 가독성을 봅니다.</span>
        <button onclick="copyPlainText()" class="btn">본문 복사</button>
      </div>
      <div id="review-panel" class="hidden" style="display:flex;flex-direction:column;gap:10px"></div>
    </section>

    <!-- 우측: 내 글 기억 -->
    <section class="right">
      <div class="head">
        <div class="label">내 글 기억</div>
        <div class="search">
          <input id="archive-search" type="text" placeholder="키워드 검색 (예: 금리, AI)" oninput="renderArchiveList()" />
          <button onclick="triggerSearchAll()" class="btn-sec btn-xs">전체</button>
        </div>
      </div>
      <div id="archive-list-container" class="mem-list">
        <div class="empty">키워드를 검색하거나 [전체]를 누르세요.</div>
      </div>
    </section>
  </main>

  <div id="toast" class="hidden"></div>

  <script>
    // 배포 전 미리보기 Worker로 테스트할 때: ?worker=draft-v2  → https://draft-v2-slack-second-brain.dloolb7.workers.dev/
    const WORKER_URL = (() => {
      const alias = new URLSearchParams(location.search).get('worker');
      return alias && /^[a-z0-9-]{1,40}$/.test(alias)
        ? `https://${alias}-slack-second-brain.dloolb7.workers.dev/`
        : "https://slack-second-brain.dloolb7.workers.dev/";
    })();

    const SECTOR_KEYS = ['stock', 'crypto', 'realestate', 'ai'];
    const SECTOR_NAMES = { stock: '증시', crypto: '가상자산', realestate: '부동산', ai: 'AI' };

    let NEWS_DATA = { stock: [], crypto: [], realestate: [], ai: [] };
    let ARCHIVES_CACHE = [];
    let currentSector = 'stock';
    let selectedNews = null;
    let saveTimer = null;
    let toastTimer = null;

    window.addEventListener('DOMContentLoaded', () => {
      fetchInitDataFromWorker();
      loadFromLocalStorage();
      initDraftStore();
    });

    // ---------- 문자열 안전 처리 헬퍼 ----------
    // 외부 데이터(뉴스 제목, AI 응답, DB 값)를 innerHTML에 넣기 전에 반드시 이스케이프
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // DB에 &quot; / &#39; 형태로 저장된 과거 데이터를 원래 문자로 복원 (textarea는 스크립트를 실행하지 않음)
    function decodeEntities(value) {
      const t = document.createElement('textarea');
      t.innerHTML = String(value ?? '');
      return t.value;
    }

    // http(s) 링크만 허용 (javascript: 등 차단)
    function safeUrl(url) {
      try {
        const u = new URL(url);
        return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '#';
      } catch (e) {
        return '#';
      }
    }

    // 브리핑 문장 속 [제목](링크), **굵게** 를 안전하게 HTML로 (먼저 이스케이프한 뒤 변환)
    function inlineMarkdown(text) {
      return escapeHtml(text)
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, url) => {
          const href = safeUrl(url.replace(/&amp;/g, '&'));
          return href === '#' ? label : `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
        })
        .replace(/\*\*([^*]+)\*\*/g, '$1');
    }

    // 과거 브리핑에 남아 있는 "[제목](None)" 링크를 "[제목]"으로 정리
    function stripBrokenLinks(text) {
      return String(text || '').replace(/\]\((?:None|null|undefined)?\)/g, ']');
    }

    function toggleTheme() {
      const dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('dad_studio_theme', dark ? 'dark' : 'light'); } catch (e) {}
    }

    function formatKstDate(isoString) {
      if (!isoString) return '날짜 없음';
      const d = new Date(isoString);
      if (isNaN(d)) return '날짜 없음';
      // en-CA 로케일은 YYYY-MM-DD 형식
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
    }

    async function fetchInitDataFromWorker() {
      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'get_init_data' })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        // 1. 가장 최근 뉴스 + 달력
        currentNewsDate = data.news_date || null;
        if (data.briefing || data.news) {
          parseAndSetNewsData(data.news, data.briefing);
          stampNewsDate(currentNewsDate);
          switchSector(currentSector);
        }
        if (currentNewsDate) calMonth = currentNewsDate.slice(0, 7);
        updateNewsDateLabel();
        renderCalendar();
        loadNewsDates();

        // 3. 아카이브 캐시 저장
        if (data.archives && Array.isArray(data.archives)) {
          ARCHIVES_CACHE = data.archives.map(item => ({
            id: item.id,
            date: formatKstDate(item.created_at),
            title: decodeEntities(item.title || '제목 없음'),
            summary: decodeEntities(item.summary || '📌 핵심 관점 요약 없음'),
            tags: Array.isArray(item.tags) && item.tags.length ? item.tags : ['#블로그아카이브'],
            link: item.source_url || '',
            snapshot: 'Supabase DB'
          }));
        }
      } catch (err) {
        console.warn('초기 데이터 로딩 에러:', err);
        showToast(`⚠️ 데이터 동기화 실패: ${err.message}`);
      }
    }

    // 브리핑 블록의 "헤더 한 줄"만 보고 섹터를 판별한다.
    // (이전에는 블록 본문 전체에서 키워드를 찾아, 본문에 "증시" 등이 나오면 다른 섹터로 잘못 분류됨)
    function detectSectorFromHeader(headerLine) {
      const h = headerLine || '';
      if (h.includes('🪙') || h.includes('가상자산') || h.includes('비트코인')) return 'crypto';
      if (h.includes('🏢') || h.includes('부동산')) return 'realestate';
      if (h.includes('🤖') || /\bAI\b/.test(h) || h.includes('보안')) return 'ai';
      if (h.includes('📈') || h.includes('증시')) return 'stock';
      return null;
    }

    function parseBriefing(briefingText) {
      const result = { stock: [], crypto: [], realestate: [], ai: [] };
      const sectorBlocks = briefingText.split(/^###\s*/m);

      sectorBlocks.forEach(block => {
        const headerLine = block.split('\n')[0];
        const targetSector = detectSectorFromHeader(headerLine);
        if (!targetSector) return;

        const sectorName = SECTOR_NAMES[targetSector];
        const items = block.split(/(?=\d+\.\s*📰)/).filter(b => b.includes('**뉴스 제목**'));

        const parsed = items.map(itemStr => {
          const titleMatch = itemStr.match(/\[(.*?)\]\((.*?)\)/);
          const summaryMatch = itemStr.match(/📌\s*\*\*핵심 요약\*\*:\s*([^\n]+)/);
          const ideaMatch = itemStr.match(/💡\s*\*\*글감 제안[^\*]*\*\*:\s*([\s\S]*?)(?=\n\d+\.|\n-|\n$|$)/);

          return {
            sector: sectorName,
            title: titleMatch ? titleMatch[1].trim() : '뉴스 제목',
            link: titleMatch ? titleMatch[2].trim() : '#',
            summary: summaryMatch ? summaryMatch[1].trim() : '요약 정보 없음',
            idea: ideaMatch ? stripBrokenLinks(ideaMatch[1].trim()) : '',
            keywords: [sectorName, 'AI요약']
          };
        });

        // 같은 섹터 헤더가 두 번 나오더라도 덮어쓰지 않고 이어 붙임
        result[targetSector] = result[targetSector].concat(parsed);
      });

      SECTOR_KEYS.forEach(s => {
        result[s] = result[s].map((item, idx) => ({ ...item, id: `${s}_${idx}` }));
      });
      return result;
    }

    function parseRawNews(rawNews) {
      const result = { stock: [], crypto: [], realestate: [], ai: [] };
      if (!rawNews) return result;

      const parseSection = (text, sectorKey) => {
        if (!text) return [];
        const sectorName = SECTOR_NAMES[sectorKey];
        const rawItems = text.split(/(?=•\s*제목:)/).filter(b => b.includes('제목:'));
        return rawItems.map((raw, idx) => {
          const titleMatch = raw.match(/•\s*제목:\s*([^\n]+)/);
          const linkMatch = raw.match(/링크:\s*([^\n]+)/);
          const summaryMatch = raw.match(/요약:\s*([\s\S]+)/);

          const title = titleMatch ? titleMatch[1].replace(/\s*-\s*[^-]+$/, '').trim() : '뉴스 제목';
          const link = linkMatch ? linkMatch[1].trim() : '#';
          let summary = summaryMatch ? summaryMatch[1].trim() : raw;
          summary = summary.replace(/^•\s*제목:[^\n]+\n?/, '').replace(/링크:[^\n]+\n?/, '').replace(/요약:\s*/, '').trim();

          return {
            id: `${sectorKey}_raw_${idx}`,
            sector: sectorName,
            title,
            link,
            // 구글 뉴스 RSS 요약은 대개 "제목 + 언론사"라 제목과 같으면 비운다
            summary: titleKey(summary).startsWith(titleKey(title).slice(0, 20)) ? '' : summary.slice(0, 150),
            idea: '',
            keywords: [sectorName, '실시간뉴스']
          };
        });
      };

      result.stock = parseSection(rawNews['증시'], 'stock');
      result.crypto = parseSection(rawNews['가상자산'] || rawNews['비트코인/이더리움'], 'crypto');
      result.realestate = parseSection(rawNews['부동산'], 'realestate');
      result.ai = parseSection(rawNews['AI'], 'ai');
      return result;
    }

    // 제목 비교용 정규화 (브리핑 기사와 원본 헤드라인 중복 판별)
    function titleKey(t) {
      return String(t || '').replace(/\s*-\s*[^-]+$/, '').replace(/[^0-9A-Za-z가-힣]/g, '').toLowerCase();
    }

    // 섹터별 목록 = AI 브리핑 기사(글감 제안 포함) + 나머지 헤드라인(최대 10개까지)
    function parseAndSetNewsData(rawNews, briefingText) {
      const fromBriefing = briefingText ? parseBriefing(briefingText) : null;
      const fromRaw = parseRawNews(rawNews);
      SECTOR_KEYS.forEach(s => {
        const brief = (fromBriefing ? fromBriefing[s] : []).map(it => ({ ...it, kind: 'brief' }));
        const links = new Set(brief.map(b => b.link));
        const titles = new Set(brief.map(b => titleKey(b.title)));
        const more = fromRaw[s]
          .filter(r => !links.has(r.link) && !titles.has(titleKey(r.title)))
          .map(it => ({ ...it, kind: 'headline' }));
        NEWS_DATA[s] = brief.concat(more).slice(0, Math.max(10, brief.length));
      });
    }

    function switchSector(sector) {
      currentSector = sector;
      SECTOR_KEYS.forEach(s => {
        const btn = document.getElementById(`tab-${s}`);
        if (btn) btn.className = s === sector ? 'tab on' : 'tab';
      });

      const container = document.getElementById('news-list-container');
      if (!container) return;
      container.innerHTML = '';

      const list = NEWS_DATA[sector] || [];
      if (list.length === 0) {
        container.innerHTML = `<div class="empty">이 섹터의 뉴스가 없습니다.</div>`;
        return;
      }

      const brief = list.filter(i => i.kind === 'brief');
      const more = list.filter(i => i.kind !== 'brief');
      const addGroup = (label, items, startNo) => {
        if (!items.length) return;
        if (brief.length) container.insertAdjacentHTML('beforeend', `<div class="group-h"><span>${label}</span><span>${items.length}</span></div>`);
        items.forEach((item, i) => {
          const row = document.createElement('div');
          const isOn = previewNewsItem && previewNewsItem.id === item.id;
          row.className = `news-item${isOn ? ' on' : ''}`;
          row.onclick = () => previewNews(item);
          row.innerHTML = `
            <span class="no">${String(startNo + i).padStart(2, '0')}</span>
            <div>
              <div class="t">${escapeHtml(item.title)}</div>
              ${item.summary ? `<div class="s clamp2">${escapeHtml(item.summary)}</div>` : ''}
            </div>`;
          container.appendChild(row);
        });
      };
      addGroup('AI 브리핑 · 글감 제안 포함', brief, 1);
      addGroup('그 밖의 헤드라인', more, brief.length + 1);
    }

    // ---------- 뉴스 카드: 미리보기 → "이 뉴스로 글쓰기"로 초안에 연결 ----------
    let previewNewsItem = null;
    const relatedCache = new Map();

    function isAttached(item) {
      return !!(selectedNews && item && (selectedNews.link && selectedNews.link === item.link || selectedNews.title === item.title));
    }

    function previewNews(item) {
      previewNewsItem = item;
      switchSector(currentSector);
      renderNewsCard();
      loadRelatedPosts(item);
      document.getElementById('selected-news-box').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function closeNewsPreview() {
      previewNewsItem = null;
      document.getElementById('selected-news-box').classList.add('hidden');
      switchSector(currentSector);
      renderAttachedNews();
    }

    function renderNewsCard() {
      const item = previewNewsItem;
      const box = document.getElementById('selected-news-box');
      if (!item) { box.classList.add('hidden'); return; }
      box.classList.remove('hidden');
      document.getElementById('ref-news-sector').textContent = `${item.sector}${item.date ? ' · ' + item.date.slice(5).replace('-', '.') : ''}`;

      const href = safeUrl(item.link);
      document.getElementById('ref-news-title-wrapper').innerHTML = `<h3>${escapeHtml(item.title)}</h3>`;

      const rel = relatedCache.get(item.id);
      const relHtml = rel === undefined
        ? '<span class="muted">관련 글을 찾는 중…</span>'
        : rel === null ? '<span class="muted">관련 글을 불러오지 못했습니다.</span>'
        : !rel.length ? '<span class="muted">비슷한 주제의 과거 글이 없습니다.</span>'
        : `<div class="related">${rel.map(p => `
            <div>
              <div class="r-t">${p.url ? `<a href="${escapeHtml(safeUrl(p.url))}" target="_blank" rel="noopener noreferrer">${escapeHtml(decodeEntities(p.title))}</a>` : escapeHtml(decodeEntities(p.title))}<span class="r-d">${escapeHtml((p.date || '').replace(/-/g, '.'))}</span></div>
              ${p.passage ? `<div class="r-p">${escapeHtml(p.passage)}</div>` : ''}
            </div>`).join('')}</div>`;

      document.getElementById('ref-news-summary').innerHTML =
        (item.summary ? `<dt>${item.kind === 'brief' ? '핵심 요약' : '요약'}</dt><dd>${escapeHtml(item.summary)}</dd>` : '') +
        (item.idea ? `<dt>글감 제안</dt><dd>${inlineMarkdown(item.idea)}</dd>` : '') +
        `<dt>내 과거 글</dt><dd>${relHtml}</dd>`;

      const attached = isAttached(item);
      document.getElementById('ref-news-actions').innerHTML =
        (attached
          ? `<button class="btn-sec" onclick="clearSelectedNews()">글 참고 해제</button><span class="muted">이 뉴스를 참고해 글을 쓰는 중</span>`
          : `<button class="btn" onclick="attachPreviewNews()">이 뉴스로 글쓰기</button>`) +
        (href !== '#' ? `<a class="btn-sec" href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">원문 ↗</a>` : '');
      renderAttachedNews();
    }

    async function loadRelatedPosts(item) {
      if (relatedCache.has(item.id)) return;
      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'related_posts', text: `${item.title}\n${item.summary}`, count: 3 })
        });
        const data = await res.json().catch(() => ({}));
        relatedCache.set(item.id, res.ok ? (data.posts || []) : null);
      } catch (e) {
        relatedCache.set(item.id, null);
      }
      if (previewNewsItem && previewNewsItem.id === item.id) renderNewsCard();
    }

    function attachPreviewNews() {
      if (!previewNewsItem) return;
      selectNewsCard(previewNewsItem);
      const memo = document.getElementById('draft-memo');
      if (!memo.value.trim()) memo.focus();
      showToast('이 뉴스를 참고해 초안을 만듭니다.');
    }

    // 초안에 연결된 뉴스 (생성 프롬프트와 DB 저장에 쓰임)
    function selectNewsCard(item, silent = false) {
      selectedNews = item;
      renderNewsCard();
      renderAttachedNews();
      if (!silent) scheduleDbSave();
    }

    function clearSelectedNews() {
      selectedNews = null;
      renderNewsCard();
      renderAttachedNews();
      scheduleDbSave();
    }

    // 카드를 닫았거나 다른 뉴스를 보고 있을 때, 지금 글에 연결된 뉴스를 제목 위에 한 줄로
    function renderAttachedNews() {
      const el = document.getElementById('attached-news');
      const show = selectedNews && !(previewNewsItem && isAttached(previewNewsItem));
      el.classList.toggle('hidden', !show);
      if (show) el.innerHTML = `<span>참고 뉴스</span><b class="clamp2" style="flex:1">${escapeHtml(selectedNews.title)}</b><button class="link" onclick="clearSelectedNews()">해제 ✕</button>`;
    }

    // ---------- 달력 ----------
    let NEWS_DATES = new Set();
    let currentNewsDate = null;   // 지금 보고 있는 뉴스의 날짜 (KST, YYYY-MM-DD)
    let calMonth = null;          // 'YYYY-MM'

    function todayKst() { return formatKstDate(new Date().toISOString()); }

    async function loadNewsDates() {
      try {
        const res = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'news_dates' }) });
        const data = await res.json();
        NEWS_DATES = new Set(data.dates || []);
      } catch (e) { console.warn('news_dates 실패:', e); }
      renderCalendar();
    }

    // 날짜가 달라도 뉴스 id가 겹치지 않도록 날짜를 붙인다
    function stampNewsDate(date) {
      if (!date) return;
      SECTOR_KEYS.forEach(s => NEWS_DATA[s] = NEWS_DATA[s].map(it => ({ ...it, id: `${date}_${it.id}`, date })));
    }

    function moveCalMonth(delta) {
      const [y, m] = (calMonth || todayKst().slice(0, 7)).split('-').map(Number);
      const d = new Date(Date.UTC(y, m - 1 + delta, 1));
      calMonth = d.toISOString().slice(0, 7);
      renderCalendar();
    }

    function renderCalendar() {
      const el = document.getElementById('calendar');
      if (!calMonth) calMonth = todayKst().slice(0, 7);
      const [y, m] = calMonth.split('-').map(Number);
      document.getElementById('cal-title').textContent = `${y}년 ${m}월`;
      const firstDow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
      const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
      const today = todayKst();
      let html = '일월화수목금토'.split('').map(d => `<div class="dow">${d}</div>`).join('');
      html += '<div></div>'.repeat(firstDow);
      for (let d = 1; d <= days; d++) {
        const date = `${calMonth}-${String(d).padStart(2, '0')}`;
        const cls = ['d', date === currentNewsDate ? 'sel' : '', date === today ? 'today' : ''].join(' ').trim();
        html += NEWS_DATES.has(date)
          ? `<button class="${cls}" onclick="selectNewsDate('${date}')" title="${date} 뉴스 보기">${d}</button>`
          : `<div class="${cls}">${d}</div>`;
      }
      el.innerHTML = html;
    }

    function updateNewsDateLabel() {
      const el = document.getElementById('news-date-label');
      if (!currentNewsDate) { el.textContent = '뉴스'; return; }
      const [y, m, d] = currentNewsDate.split('-').map(Number);
      const dow = '일월화수목금토'[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
      el.textContent = `${m}월 ${d}일 (${dow}) 뉴스${currentNewsDate === todayKst() ? ' · 오늘' : ''}`;
    }

    async function selectNewsDate(date) {
      if (date === currentNewsDate) return;
      const prev = currentNewsDate;
      currentNewsDate = date;
      renderCalendar();
      document.getElementById('news-list-container').innerHTML = '<div class="empty">불러오는 중…</div>';
      try {
        const res = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'news_by_date', date }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        parseAndSetNewsData(data.news, data.briefing);
        stampNewsDate(date);
        updateNewsDateLabel();
        switchSector(currentSector);
      } catch (e) {
        currentNewsDate = prev;
        renderCalendar();
        switchSector(currentSector);
        showToast(`⚠️ 뉴스를 불러오지 못했습니다: ${e.message}`);
      }
    }

    function renderArchiveList(showAll = false) {
      const container = document.getElementById('archive-list-container');
      if (!container) return;
      const typed = document.getElementById('archive-search').value.trim().toLowerCase();
      const query = showAll === true && !typed ? 'all' : typed;

      if (!query) {
        container.innerHTML = `<div class="empty">키워드를 검색하거나 [전체]를 누르세요.</div>`;
        return;
      }

      container.innerHTML = '';
      const filtered = ARCHIVES_CACHE.filter(item => {
        if (query === 'all') return true;
        return item.title.toLowerCase().includes(query) || item.summary.toLowerCase().includes(query) || item.tags.some(t => t.toLowerCase().includes(query));
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty">검색된 글이 없습니다.</div>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'mem';
        const titleHtml = item.link
          ? `<a href="${escapeHtml(safeUrl(item.link))}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>`
          : escapeHtml(item.title);
        card.innerHTML = `
          <div class="tt">${titleHtml}</div>
          <div class="dt">${escapeHtml(item.date.replace(/-/g, '.'))}</div>
          <div class="ps clamp3">${escapeHtml(item.summary)}</div>
          <div class="kw">${item.tags.map(t => `<span class="tag">${escapeHtml(String(t).replace(/^#/, ''))}</span>`).join('')}</div>`;
        container.appendChild(card);
      });
    }

    function triggerSearchAll() {
      document.getElementById('archive-search').value = '';
      renderArchiveList(true);
    }

    function handleDraftInput() {
      const title = document.getElementById('draft-title').value;
      const memo = document.getElementById('draft-memo').value;
      const words = memo.trim() ? memo.trim().split(/\s+/).length : 0;
      document.getElementById('char-count').textContent = `${memo.length.toLocaleString()}자`;
      document.getElementById('word-count').textContent = `${words.toLocaleString()}단어`;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        localStorage.setItem('dad_studio_draft', JSON.stringify({ title, memo }));
      }, 400);
      scheduleDbSave();
    }

    // 예전 태그 입력칸에 있던 값은 메모 끝으로 옮긴다 (Worker가 메모 속 #태그를 필수 해시태그로 사용)
    function mergeTagsIntoMemo(memo, tags) {
      memo = memo || '';
      const missing = String(tags || '').split(/[\s,]+/).filter(Boolean)
        .map(t => t.startsWith('#') ? t : '#' + t)
        .filter(t => !memo.includes(t));
      return missing.length ? (memo.trimEnd() + (memo.trim() ? '\n' : '') + missing.join(' ')) : memo;
    }

    function loadFromLocalStorage() {
      const saved = localStorage.getItem('dad_studio_draft');
      if (saved) {
        try {
          const { title, memo, tags } = JSON.parse(saved);
          document.getElementById('draft-title').value = title || '';
          document.getElementById('draft-memo').value = mergeTagsIntoMemo(memo, tags);
          handleDraftInput();
        } catch (e) {}
      }
      const savedBody = localStorage.getItem('dad_studio_body');
      if (savedBody) {
        document.getElementById('refined-output').value = savedBody;
        updateBodyCount();
      }
    }

    // 2단계 캔버스(생성 결과 + 직접 수정) 자동 저장
    let bodySaveTimer = null;
    let lastGeneratedBody = '';
    function updateBodyCount() {
      const body = document.getElementById('refined-output').value;
      const gaps = (body.match(/\[✍️ 보충 필요/g) || []).length;
      document.getElementById('body-count').textContent =
        `${body.length.toLocaleString()}자` + (gaps ? ` · ✍️ 보충 필요 ${gaps}곳` : '');
    }
    function handleBodyInput() {
      updateBodyCount();
      // 본문이 바뀌면 첨삭 카드의 "위치를 찾을 수 없음" 상태를 갱신
      if (reviewState) { clearTimeout(window.__reviewRerender); window.__reviewRerender = setTimeout(renderReview, 300); }
      clearTimeout(bodySaveTimer);
      bodySaveTimer = setTimeout(() => {
        localStorage.setItem('dad_studio_body', document.getElementById('refined-output').value);
      }, 400);
      scheduleDbSave();
    }

    function renderDraftMeta(meta) {
      const box = document.getElementById('draft-meta');
      if (!meta) { box.classList.add('hidden'); box.innerHTML = ''; return; }
      const pct = Math.round((meta.ai_ratio || 0) * 100);
      const lines = [
        `<div>AI가 덧붙인 문장 <b>${pct}%</b> · 나머지는 내 메모를 다듬은 문단입니다.${pct >= 30 ? ' <span class="hot">AI 비중이 높습니다. 메모를 보강해 보세요.</span>' : ''}</div>`
      ];
      if (meta.gaps && meta.gaps.length) {
        lines.push(`<div>보충 필요 <b>${meta.gaps.length}곳</b> — ${meta.gaps.map(escapeHtml).join(' / ')}</div>`);
      }
      if (meta.related_posts && meta.related_posts.length) {
        lines.push(`<div>연결한 과거 글 — ${meta.related_posts.map(r =>
          `<a href="${escapeHtml(safeUrl(r.url))}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.title)}</a>`).join(', ')}</div>`);
      }
      box.innerHTML = lines.join('');
      box.classList.remove('hidden');
    }

    async function runThreeStageRefiner() {
      const title = document.getElementById('draft-title').value.trim();
      const memo = document.getElementById('draft-memo').value.trim();
      const btn = document.getElementById('btn-refine');
      const engineBadge = document.getElementById('engine-badge');
      const output = document.getElementById('refined-output');

      // 1. 유효성 검사: 글의 내용은 초안에서만 나오므로 메모가 필요
      if (!memo) {
        showToast('⚠️ 메모에 생각나는 대로 먼저 적어 주세요.');
        return;
      }

      // 캔버스를 직접 고친 상태라면 덮어쓰기 전에 확인
      const current = output.value.trim();
      if (current && current !== lastGeneratedBody.trim() &&
          !confirm('본문에 직접 쓰거나 고친 내용이 있습니다. 새로 만든 글로 바꿀까요?')) {
        return;
      }

      // 2. 로딩 상태 표시
      btn.disabled = true;
      btn.style.opacity = '0.7';
      if (engineBadge) engineBadge.textContent = '생성 중...';
      showToast('✨ 내 초안을 블로그 글로 정리하는 중입니다... (20~40초)');

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'web_draft',
            title,
            memo,
            news: selectedNews ? { title: selectedNews.title, summary: selectedNews.summary, link: selectedNews.link } : null
          })
        });

        const data = await response.json().catch(() => ({}));
        if (response.status === 429) throw new Error(data.error || '요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.');
        if (!response.ok) throw new Error(data.error || `HTTP 에러 ${response.status}`);

        if (data.draft) {
          output.value = data.draft.trim();
          lastGeneratedBody = output.value;
          // 새 글이 생성되면 이전 첨삭 결과는 초기화
          reviewState = null;
          reviewAcceptedChars = 0;
          renderReview();
          document.getElementById('review-summary').textContent = REVIEW_HINT;
          lastAiRatio = typeof data.meta?.ai_ratio === 'number' ? data.meta.ai_ratio : null;
          handleBodyInput();
          renderDraftMeta(data.meta);
          if (engineBadge) engineBadge.textContent = '생성 완료';
          showToast('✅ 블로그 글 정리가 완료되었습니다. 보충 필요한 곳을 채워 주세요.');
        } else {
          if (engineBadge) engineBadge.textContent = '응답 없음';
          showToast('⚠️ AI 응답 텍스트가 비어있습니다.');
        }
      } catch (err) {
        console.error('Refine Error:', err);
        showToast(`⚠️ 생성 실패: ${err.message}`);
        if (engineBadge) engineBadge.textContent = '오류 발생';
      } finally {
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    }

    async function copyPlainText() {
      const text = document.getElementById('refined-output').value.trim();
      if (!text) {
        showToast('⚠️ 복사할 내용이 없습니다.');
        return;
      }
      const gaps = (text.match(/\[✍️ 보충 필요/g) || []).length;
      if (gaps && !confirm(`아직 채우지 않은 [✍️ 보충 필요]가 ${gaps}곳 있습니다. 그래도 복사할까요?`)) {
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        showToast('📄 클립보드에 복사되었습니다.');
      } catch (e) {
        showToast('⚠️ 클립보드 복사에 실패했습니다.');
      }
    }

    // ---------- 첨삭 (review) ----------
    const REVIEW_HINT = '논리·구조, 내 문체, 가독성을 봅니다.';
    const REVIEW_CATEGORY = {
      logic:       { label: '논리' },
      structure:   { label: '구조' },
      style:       { label: '문체' },
      readability: { label: '가독성' }
    };
    const SEVERITY_LABEL = { high: '중요', medium: '보통', low: '사소' };
    const STATUS_LABEL = { ok: '충분', weak: '약함', missing: '없음' };
    let reviewState = null;      // { structure, comments, style, decisions: {id: 'accepted'|'dismissed'} }
    let reviewAcceptedChars = 0; // 첨삭 수락으로 바뀐 글자 수

    async function runReview() {
      const output = document.getElementById('refined-output');
      const body = output.value;
      if (body.trim().length < 50) {
        showToast('⚠️ 첨삭할 본문을 50자 이상 작성해 주세요.');
        return;
      }
      const btn = document.getElementById('btn-review');
      btn.disabled = true;
      btn.style.opacity = '0.7';
      btn.textContent = '첨삭 중...';
      try {
        // DB 저장을 쓰는 중이면 먼저 저장해 초안 id를 확보 (첨삭 이력 연결용)
        if (getWorkKey()) await flushDbSave();
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: workHeaders(),
          body: JSON.stringify({
            type: 'review',
            title: document.getElementById('draft-title').value.trim(),
            memo: document.getElementById('draft-memo').value.trim(),
            body,
            draft_id: currentDraftId || undefined
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `HTTP 에러 ${response.status}`);
        if (data.review_save_error) console.warn('첨삭 이력 저장 실패:', data.review_save_error);
        reviewState = { ...data, decisions: {} };
        renderReview();
        showToast(`🔍 첨삭 완료: 코멘트 ${data.comments.length}개`);
      } catch (err) {
        console.error('Review Error:', err);
        showToast(`⚠️ 첨삭 실패: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.textContent = '첨삭 받기';
      }
    }

    function renderReview() {
      const panel = document.getElementById('review-panel');
      if (!reviewState) { panel.classList.add('hidden'); panel.innerHTML = ''; return; }
      const body = document.getElementById('refined-output').value;
      const { structure, comments, style, decisions } = reviewState;

      const structureHtml = [['intro', '도입'], ['body', '근거'], ['insight', '관점']].map(([k, label]) => {
        const s = structure[k] || {};
        const st = ['ok', 'weak', 'missing'].includes(s.status) ? s.status : 'weak';
        return `<div class="rv-box">
          <div class="h"><span class="dot ${st}"></span>${label} <span class="muted" style="font-weight:400">${STATUS_LABEL[st]}</span></div>
          <div class="b">${escapeHtml(s.comment || '')}</div>
        </div>`;
      }).join('');

      const styleHtml = (style.notes || []).length
        ? `<div class="rv-style">
            <div><b>내 글 기준선과 비교</b> <span class="muted">자동 측정${reviewState.baseline_source ? ` · ${escapeHtml(reviewState.baseline_source)}` : ''}</span></div>
            ${style.notes.map(n => `<div>· ${escapeHtml(n)}</div>`).join('')}
          </div>`
        : `<div class="rv-style">길이·줄 길이·어미·이모지가 평소 글 기준선 안에 있습니다.</div>`;

      const open = comments.filter(c => !decisions[c.id]);
      const cardsHtml = comments.map(c => {
        const cat = REVIEW_CATEGORY[c.category] || REVIEW_CATEGORY.readability;
        const decided = decisions[c.id];
        const stale = !decided && !body.includes(c.target);
        const catKey = REVIEW_CATEGORY[c.category] ? c.category : 'readability';
        const actions = decided
          ? `<span>${decided === 'accepted' ? '수락함' : '무시함'}</span>`
          : stale
            ? `<span>본문이 바뀌어 위치를 찾을 수 없음</span>`
            : `<button onclick="locateReviewTarget('${c.id}')" class="btn-sec btn-xs">위치 보기</button>
               ${c.suggestion ? `<button onclick="acceptReview('${c.id}')" class="btn btn-xs">수락</button>` : ''}
               <button onclick="dismissReview('${c.id}')" class="btn-sec btn-xs">무시</button>`;
        return `<div class="rv-card${decided || stale ? ' dim' : ''}">
          <div class="row"><span class="rv-cat ${catKey}">${cat.label}</span><span class="muted">${SEVERITY_LABEL[c.severity] || ''}</span></div>
          <div class="rv-target clamp3">${escapeHtml(c.target)}</div>
          <div class="rv-comment">${escapeHtml(c.comment)}</div>
          ${c.suggestion ? `<div class="rv-sugg"><b>수정안</b>\n${escapeHtml(c.suggestion)}</div>` : ''}
          <div class="rv-actions">${actions}</div>
        </div>`;
      }).join('');

      const pct = body.length ? Math.round(reviewAcceptedChars / body.length * 100) : 0;
      panel.innerHTML = `
        <div class="rv-structure">${structureHtml}</div>
        ${styleHtml}
        <div class="muted">코멘트 ${comments.length}개 · 남은 것 ${open.length}개 · 첨삭 수락으로 바뀐 글자 ${reviewAcceptedChars.toLocaleString()}자 (${pct}%)</div>
        ${cardsHtml || '<div class="muted">지적할 문장이 없습니다.</div>'}
      `;
      panel.classList.remove('hidden');
      document.getElementById('review-summary').textContent =
        `첨삭 결과: 코멘트 ${comments.length}개 중 ${open.length}개 남음`;
    }

    function findReviewComment(id) {
      return reviewState && reviewState.comments.find(c => c.id === id);
    }

    function locateReviewTarget(id) {
      const c = findReviewComment(id);
      const output = document.getElementById('refined-output');
      const idx = c ? output.value.indexOf(c.target) : -1;
      if (idx < 0) { showToast('⚠️ 본문에서 해당 문장을 찾을 수 없습니다.'); renderReview(); return; }
      output.focus();
      output.setSelectionRange(idx, idx + c.target.length);
      // 선택 위치까지 스크롤 (줄 수 비율로 근사)
      const before = output.value.slice(0, idx).split('\n').length;
      const total = output.value.split('\n').length;
      output.scrollTop = Math.max(0, (before / total) * output.scrollHeight - output.clientHeight / 3);
      output.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function acceptReview(id) {
      const c = findReviewComment(id);
      const output = document.getElementById('refined-output');
      if (!c || !c.suggestion) return;
      const idx = output.value.indexOf(c.target);
      if (idx < 0) { showToast('⚠️ 본문이 바뀌어 수정안을 적용할 수 없습니다.'); renderReview(); return; }
      output.value = output.value.slice(0, idx) + c.suggestion + output.value.slice(idx + c.target.length);
      reviewAcceptedChars += c.suggestion.length;
      reviewState.decisions[id] = 'accepted';
      handleBodyInput();
      renderReview();
      saveReviewDecisions();
      output.focus();
      output.setSelectionRange(idx, idx + c.suggestion.length);
      showToast('✔ 수정안을 반영했습니다. 마음에 안 들면 Ctrl+Z 대신 직접 고쳐 주세요.');
    }

    function dismissReview(id) {
      if (!reviewState) return;
      reviewState.decisions[id] = 'dismissed';
      renderReview();
      saveReviewDecisions();
    }

    // ---------- 초안 DB 저장 (작업 키) ----------
    const LS = { key: 'dad_studio_work_key', id: 'dad_studio_draft_id', ts: 'dad_studio_draft_updated_at' };
    let currentDraftId = null;
    let currentUpdatedAt = null;
    let lastAiRatio = null;
    let dbSaveTimer = null;
    let dbSaving = null;          // 진행 중인 저장 Promise
    let dbDirty = false;
    let draftList = [];

    function getWorkKey() {
      try { return localStorage.getItem(LS.key) || ''; } catch (e) { return ''; }
    }
    function workHeaders() {
      const h = { 'Content-Type': 'application/json' };
      const k = getWorkKey();
      if (k) h['X-Work-Key'] = k;
      return h;
    }
    function setDbStatus(text, tone = 'muted') {
      // 평소에는 작은 회색 글씨, 문제가 있을 때만 눈에 띄게
      const el = document.getElementById('db-status');
      el.textContent = text;
      el.className = tone === 'warn' ? 'saved warn' : 'saved';
      el.title = tone === 'warn' ? '서버 저장에 문제가 있습니다. 이 브라우저에는 저장되어 있습니다.' : '';
    }

    async function draftApi(type, payload = {}) {
      const res = await fetch(WORKER_URL, { method: 'POST', headers: workHeaders(), body: JSON.stringify({ type, ...payload }) });
      const data = await res.json().catch(() => ({}));
      return { status: res.status, data };
    }

    function setWorkKey() {
      const current = getWorkKey();
      const input = prompt(
        '작업 키를 입력하세요.\n' +
        '· Cloudflare Worker의 WORK_KEY Secret과 같은 값이어야 합니다.\n' +
        '· 이 브라우저에만 저장됩니다. 비우고 확인하면 DB 저장을 끕니다.',
        current ? '(변경하지 않으려면 취소)' : '');
      if (input === null || input === '(변경하지 않으려면 취소)') return;
      try {
        if (input.trim()) localStorage.setItem(LS.key, input.trim());
        else localStorage.removeItem(LS.key);
      } catch (e) {}
      initDraftStore();
    }

    async function initDraftStore() {
      try {
        currentDraftId = Number(localStorage.getItem(LS.id)) || null;
        currentUpdatedAt = localStorage.getItem(LS.ts) || null;
      } catch (e) {}
      const select = document.getElementById('draft-select');
      const keyBtn = document.getElementById('work-key-btn');
      if (!getWorkKey()) {
        select.disabled = true;
        select.innerHTML = '<option value="">작업 키를 설정하면 초안 목록이 보입니다</option>';
        document.getElementById('btn-archive').disabled = true;
        keyBtn.classList.remove('on');
        keyBtn.title = '작업 키 — 설정하면 초안을 서버(DB)에 저장해 다른 기기에서도 이어 쓸 수 있습니다';
        setDbStatus('이 브라우저에 저장');
        return;
      }
      keyBtn.classList.add('on');
      keyBtn.title = '작업 키 설정됨 — 눌러서 변경';
      await refreshDraftList();
      await syncCurrentDraftOnLoad();
    }

    // 페이지를 열 때: 다른 기기에서 고친 최신본이 있으면 불러오고, 아니면 첨삭 이력만 복원
    async function syncCurrentDraftOnLoad() {
      if (!currentDraftId) return;
      try {
        const { status, data } = await draftApi('draft_get', { id: currentDraftId });
        if (status !== 200) return;
        if (currentUpdatedAt && data.draft.updated_at !== currentUpdatedAt) {
          applyDraft(data.draft, data.reviews);
          showToast('🔄 다른 기기에서 수정된 최신 초안을 불러왔습니다.');
        } else if (data.reviews && data.reviews[0] && !reviewState) {
          const last = data.reviews[0];
          reviewState = { ...last.result, review_id: last.id, decisions: last.decisions || {} };
          renderReview();
        }
        setDbStatus('DB 연결됨', 'ok');
      } catch (e) {
        console.warn('초안 동기화 실패:', e);
      }
    }

    async function refreshDraftList() {
      const select = document.getElementById('draft-select');
      try {
        const { status, data } = await draftApi('drafts_list');
        if (status === 401) { setDbStatus('작업 키 불일치', 'warn'); showToast('⚠️ 작업 키가 서버와 다릅니다. 🔑 버튼으로 다시 입력해 주세요.'); select.disabled = true; return; }
        if (status === 503) { setDbStatus('서버 키 미설정', 'warn'); select.disabled = true; select.innerHTML = '<option value="">서버에 WORK_KEY가 아직 없습니다</option>'; return; }
        if (status !== 200) throw new Error(data.error || `HTTP ${status}`);
        draftList = data.drafts || [];
        // 현재 초안이 목록에 없으면(보관됨/삭제됨) 새 초안 상태로
        if (currentDraftId && !draftList.some(d => d.id === currentDraftId)) setCurrentDraft(null, null);
        renderDraftSelect();
        select.disabled = false;
        document.getElementById('btn-archive').disabled = !currentDraftId;
        setDbStatus(currentDraftId ? 'DB 연결됨' : '새 초안', 'ok');
      } catch (e) {
        setDbStatus('DB 연결 실패', 'warn');
        console.warn('drafts_list 실패:', e);
      }
    }

    function draftLabel(d) {
      const date = formatKstDate(d.updated_at).slice(5);
      const st = { writing: '작성중', reviewed: '첨삭함', published: '발행' }[d.status] || d.status;
      const name = (d.title || d.memo || '(제목 없음)').replace(/\s+/g, ' ').slice(0, 40);
      return `${date} · ${name} [${st}]`;
    }

    function renderDraftSelect() {
      const select = document.getElementById('draft-select');
      const opts = [`<option value="">${currentDraftId ? '＋ 새 초안으로 전환…' : '✏️ 새 초안 (아직 저장 안 됨)'}</option>`]
        .concat(draftList.map(d => `<option value="${d.id}" ${d.id === currentDraftId ? 'selected' : ''}>${escapeHtml(draftLabel(d))}</option>`));
      select.innerHTML = opts.join('');
      if (!currentDraftId) select.value = '';
    }

    function setCurrentDraft(id, updatedAt) {
      currentDraftId = id;
      currentUpdatedAt = updatedAt;
      try {
        if (id) { localStorage.setItem(LS.id, String(id)); localStorage.setItem(LS.ts, updatedAt || ''); }
        else { localStorage.removeItem(LS.id); localStorage.removeItem(LS.ts); }
      } catch (e) {}
      document.getElementById('btn-archive').disabled = !id;
    }

    function collectDraft() {
      return {
        title: document.getElementById('draft-title').value,
        memo: document.getElementById('draft-memo').value,
        tags: '',
        body: document.getElementById('refined-output').value,
        news: selectedNews ? { title: selectedNews.title, summary: selectedNews.summary, link: selectedNews.link } : null,
        ...(lastAiRatio !== null ? { ai_ratio: lastAiRatio } : {})
      };
    }

    function scheduleDbSave() {
      if (!getWorkKey() || suppressDbSave) return;
      dbDirty = true;
      setDbStatus('저장 대기…');
      clearTimeout(dbSaveTimer);
      dbSaveTimer = setTimeout(() => flushDbSave(), 2500);
    }

    let suppressDbSave = false;   // 초안 불러오는 동안 저장 트리거 막기

    async function flushDbSave(force = false) {
      clearTimeout(dbSaveTimer);
      if (dbSaving) await dbSaving;
      if (!getWorkKey() || (!dbDirty && !force)) return;
      const draft = collectDraft();
      if (!currentDraftId && !draft.memo.trim() && !draft.body.trim() && !draft.title.trim()) { dbDirty = false; setDbStatus('새 초안', 'ok'); return; }
      dbDirty = false;
      setDbStatus('저장 중…');
      dbSaving = (async () => {
        try {
          let { status, data } = await draftApi('draft_save', { id: currentDraftId || undefined, base_updated_at: currentUpdatedAt || undefined, draft });
          if (status === 409) {
            const overwrite = confirm(
              '다른 기기(또는 다른 탭)에서 이 초안이 먼저 수정됐습니다.\n\n' +
              '[확인] 지금 화면의 내용으로 덮어쓰기\n[취소] 서버에 저장된 최신 버전 불러오기');
            if (overwrite) {
              ({ status, data } = await draftApi('draft_save', { id: currentDraftId, force: true, draft }));
            } else {
              applyDraft(data.draft, []);
              setDbStatus('최신본 불러옴', 'ok');
              return;
            }
          }
          if (status !== 200) throw new Error(data.error || `HTTP ${status}`);
          const isNew = !currentDraftId;
          setCurrentDraft(data.id, data.updated_at);
          const t = new Date(data.updated_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
          setDbStatus(`DB 저장됨 ${t}`, 'ok');
          if (isNew) refreshDraftList();
          else {
            const d = draftList.find(x => x.id === data.id);
            if (d) { d.title = draft.title; d.memo = draft.memo.slice(0, 80); d.updated_at = data.updated_at; renderDraftSelect(); }
          }
        } catch (e) {
          dbDirty = true;
          setDbStatus('DB 저장 실패', 'warn');
          console.warn('draft_save 실패:', e);
        }
      })();
      await dbSaving;
      dbSaving = null;
    }

    function applyDraft(d, reviews) {
      suppressDbSave = true;
      try {
        document.getElementById('draft-title').value = d.title || '';
        document.getElementById('draft-memo').value = mergeTagsIntoMemo(d.memo, d.tags);
        document.getElementById('refined-output').value = d.body || '';
        handleDraftInput();
        handleBodyInput();
        lastGeneratedBody = d.body || '';
        lastAiRatio = typeof d.ai_ratio === 'number' ? d.ai_ratio : null;
        renderDraftMeta(null);
        selectedNews = (d.news && d.news.title)
          ? { id: `saved_${d.id}`, sector: '저장된 뉴스', title: d.news.title, summary: d.news.summary || '', link: d.news.link || '#', idea: '' }
          : null;
        renderNewsCard();
        renderAttachedNews();
        // 가장 최근 첨삭 결과 복원
        const last = (reviews || [])[0];
        reviewAcceptedChars = 0;
        reviewState = last ? { ...last.result, review_id: last.id, decisions: last.decisions || {} } : null;
        renderReview();
        if (!last) document.getElementById('review-summary').textContent = REVIEW_HINT;
        setCurrentDraft(d.id, d.updated_at);
        dbDirty = false;
        clearTimeout(dbSaveTimer);
      } finally {
        suppressDbSave = false;
      }
    }

    async function onDraftSelect(value) {
      await flushDbSave();
      if (!value) { newDraft(true); return; }
      setDbStatus('불러오는 중…');
      const { status, data } = await draftApi('draft_get', { id: Number(value) });
      if (status !== 200) { showToast(`⚠️ 초안을 불러오지 못했습니다: ${data.error || status}`); refreshDraftList(); return; }
      applyDraft(data.draft, data.reviews);
      renderDraftSelect();
      setDbStatus('DB 연결됨', 'ok');
      showToast('📂 초안을 불러왔습니다.');
    }

    async function newDraft(skipFlush = false) {
      if (!skipFlush) await flushDbSave();
      applyDraft({ id: null, title: '', memo: '', tags: '', body: '', news: null, updated_at: null }, []);
      setCurrentDraft(null, null);
      try { localStorage.removeItem('dad_studio_body'); } catch (e) {}
      renderDraftSelect();
      setDbStatus(getWorkKey() ? '새 초안' : '이 브라우저에 저장', 'ok');
    }

    async function archiveCurrentDraft() {
      if (!currentDraftId) return;
      if (!confirm('이 초안을 보관할까요? 목록에서 사라지지만 DB에는 남아 있습니다.')) return;
      await flushDbSave();
      const { status, data } = await draftApi('draft_archive', { id: currentDraftId });
      if (status !== 200) { showToast(`⚠️ 보관 실패: ${data.error || status}`); return; }
      showToast('🗄️ 초안을 보관했습니다.');
      await newDraft(true);
      refreshDraftList();
    }

    let decisionTimer = null;
    function saveReviewDecisions() {
      if (!getWorkKey() || !reviewState?.review_id) return;
      clearTimeout(decisionTimer);
      decisionTimer = setTimeout(() => {
        draftApi('review_decision', { review_id: reviewState.review_id, decisions: reviewState.decisions })
          .catch(e => console.warn('review_decision 실패:', e));
      }, 800);
    }

    // 탭을 닫기 전에 남은 저장 시도
    window.addEventListener('beforeunload', () => {
      if (dbDirty && getWorkKey()) {
        try {
          fetch(WORKER_URL, { method: 'POST', headers: workHeaders(), keepalive: true,
            body: JSON.stringify({ type: 'draft_save', id: currentDraftId || undefined, base_updated_at: currentUpdatedAt || undefined, draft: collectDraft() }) });
        } catch (e) {}
      }
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add('hidden'), 3200);
    }
  </script>
</body>
</html>
