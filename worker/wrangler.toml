# Cloudflare Worker: slack-second-brain
# 배포: (이 폴더에서) npx wrangler deploy
#
# 비밀 값은 코드에 넣지 않고 Cloudflare에만 저장합니다.
#   SUPABASE_URL, SUPABASE_KEY, GEMINI_API_KEY, SLACK_BOT_TOKEN
# 새로 등록/교체할 때: npx wrangler secret put <이름>

name = "slack-second-brain"
main = "src/index.js"
compatibility_date = "2026-11-03"

# 대시보드에서 일반 변수(Plain text)로 등록한 값이 배포 시 지워지지 않도록 유지
keep_vars = true

# 버전 미리보기 URL: 평소에는 끔 (과거 테스트 버전이 외부에서 호출되지 않도록)
# 배포 전 테스트할 때만 true로 바꾸고 versions upload --preview-alias 사용 → 테스트 후 다시 false로 배포
preview_urls = false

# AI 요청(web_draft/review/research) 남용 방지: IP당 60초에 10회
[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# ---------- 테스터용 (한 벌 더): npx wrangler deploy --env tester ----------
# 이름이 다른 별도 Worker(studio-tester)로 배포되고, 비밀 값·DB도 따로 씁니다.
# 비밀 값: npx wrangler secret put <이름> --env tester  (SUPABASE_URL, SUPABASE_KEY, GEMINI_API_KEY, WORK_KEY)
[env.tester]
name = "studio-tester"

# 테스터 블로그 (ID를 받으면 바꿔서 다시 배포). 값이 없으면 내 블로그로 동작하므로 꼭 지정
[env.tester.vars]
BLOG_ID = "pjdr0430"
BLOG_NAME = "감자와 고구마 부부의 일상"

[[env.tester.ratelimits]]
name = "AI_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
